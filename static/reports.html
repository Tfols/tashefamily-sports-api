<meta charset="UTF-8">

<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-1:     #060a14;
  --bg-2:     #111b32;
  --panel:    rgba(15,24,42,0.92);
  --chip:     rgba(18,31,54,0.96);
  --border:   #2e446f;
  --border-s: #3b588e;
  --rule:     #304975;
  --text:     #d9e7ff;
  --bright:   #f3f8ff;
  --muted:    #90a9ca;
  --head:     #bfdbff;
  --accent:   #38bdf8;
  --ok:       #34d399;
  --bad:      #fb7185;
  --blue-grd: linear-gradient(90deg, #38bdf8, #5d8bff);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  background: linear-gradient(135deg, var(--bg-1), var(--bg-2)) fixed;
  color: var(--text);
  font-family: "Space Grotesk", sans-serif;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(26,42,70,0.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,42,70,0.35) 1px, transparent 1px);
  background-size: 24px 24px;
  opacity: 0.45;
}

#app {
  position: relative; z-index: 1;
  max-width: 960px; margin: 0 auto;
  padding: 28px 20px;
}

/* ── Page header ─────────────────────────────────────────── */
#page-header {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--rule);
}
#back-link {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; font-weight: 600;
  color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  text-decoration: none;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  flex: 0 0 auto;
  transition: color 0.15s, border-color 0.15s;
}
#back-link:hover { color: var(--accent); border-color: var(--accent); }
#page-title {
  font-size: 22px; font-weight: 700;
  color: var(--bright); letter-spacing: 0.02em;
}
#page-sub {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; color: var(--muted);
  letter-spacing: 0.08em; margin-top: 4px;
}

/* ── Topic section ───────────────────────────────────────── */
.topic-section {
  margin-bottom: 24px;
}
.topic-header {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--head);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 10px;
}

/* ── Report cards grid ───────────────────────────────────── */
.report-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* Single-file card (link wrapper) */
.report-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  text-decoration: none;
  display: block;
  transition: border-color 0.15s, transform 0.12s;
}
.report-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

/* Multi-file card (div wrapper) */
.report-card-multi {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  display: block;
}
.report-card-bar { height: 3px; background: var(--blue-grd); }
.report-card-body {
  padding: 14px 14px 12px;
  display: flex; flex-direction: column; gap: 4px;
}
.report-icon {
  font-size: 26px; line-height: 1;
  margin-bottom: 4px;
}
.report-name {
  font-size: 14px; font-weight: 700;
  color: var(--bright); letter-spacing: 0.01em;
  line-height: 1.3;
}
.report-desc {
  font-size: 12px; color: var(--muted);
  line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.report-meta {
  font-family: "JetBrains Mono", monospace;
  font-size: 9px; color: var(--muted);
  letter-spacing: 0.04em;
  margin-top: 4px;
  opacity: 0.7;
}

/* Sub-links inside a multi-file card */
.report-files {
  display: flex; flex-direction: column;
  gap: 0;
  margin-top: 8px;
  border-top: 1px solid var(--border);
}
.report-file-link {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  text-decoration: none;
  transition: background 0.12s;
  border-bottom: 1px solid var(--border);
}
.report-file-link:last-child { border-bottom: none; }
.report-file-link:hover { background: rgba(255,255,255,0.04); }
.report-file-icon { font-size: 18px; flex: 0 0 auto; }
.report-file-info { flex: 1; min-width: 0; }
.report-file-name {
  font-size: 13px; font-weight: 600;
  color: var(--bright);
  line-height: 1.3;
}
.report-file-desc {
  font-size: 11px; color: var(--muted);
  line-height: 1.3; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.report-file-arrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  flex: 0 0 auto;
  transition: color 0.12s, transform 0.12s;
}
.report-file-link:hover .report-file-arrow {
  color: var(--accent);
  transform: translateX(2px);
}

.report-cell { display: contents; }

.empty-topic {
  grid-column: 1 / -1;
  text-align: center; padding: 20px;
  color: var(--muted); font-size: 12px;
  font-style: italic;
}

const TYPE_ICONS = {
  PDF:   '📄', DOCX:  '📝', XLSX:  '📊', CSV:   '📊',
  PPTX:  '📊', PNG:   '🖼️', JPG:   '🖼️', SVG:   '🖼️',
  TXT:   '📃', HTML:  '🌐',
};

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(r) {
  if (r.files) {
    return `<div class="report-card-multi">
      <div class="report-card-bar"></div>
      <div class="report-card-body">
        <div class="report-icon">${r.icon || '📄'}</div>
        <div class="report-name">${escHtml(r.name)}</div>
        ${r.desc ? `<div class="report-desc">${escHtml(r.desc)}</div>` : ''}
        ${r.date ? `<div class="report-meta">${escHtml(r.date)}</div>` : ''}
      </div>
      <div class="report-files">
        ${r.files.map(f => `
          <a href="${escHtml(f.file)}" target="_blank" class="report-file-link">
            <div class="report-file-icon">${f.icon || '📄'}</div>
            <div class="report-file-info">
              <div class="report-file-name">${escHtml(f.label)}</div>
              ${f.desc ? `<div class="report-file-desc">${escHtml(f.desc)}</div>` : ''}
            </div>
            <div class="report-file-arrow">→</div>
          </a>
        `).join('')}
      </div>
    </div>`;
  }
  return `<a href="${escHtml(r.file)}" target="_blank" class="report-card">
    <div class="report-card-bar"></div>
    <div class="report-card-body">
      <div class="report-icon">${r.icon || TYPE_ICONS[r.type] || '📄'}</div>
      <div class="report-name">${escHtml(r.name)}</div>
      ${r.desc ? `<div class="report-desc">${escHtml(r.desc)}</div>` : ''}
      <div class="report-meta">${escHtml(r.type)}${r.date ? ' · ' + escHtml(r.date) : ''}</div>
    </div>
  </a>`;
}

function render() {
  const el = document.getElementById('report-sections');

  if (!REPORTS.length) {
    el.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;font-style:italic;">No reports yet</div>';
    return;
  }

  el.innerHTML = `<div class="report-grid">
    ${REPORTS.map(r => {
      const theme = r.theme ? ` theme-${r.theme}` : '';
      return `<div class="report-cell${theme}">${renderCard(r)}</div>`;
    }).join('')}
  </div>`;
}
